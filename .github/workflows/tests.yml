name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -r requirements.txt
      - name: Unit + end-to-end tests
        run: python -m pytest -q
      - name: Replay demo scenarios
        run: python -m sajag demo --report
      - name: Evaluation
        run: python scripts/evaluate.py
